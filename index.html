<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>🎤 Speaking Practice</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow:
        0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .text {
      line-height: 1.7;
    }

    .mic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: #111;
      color: white;
      font-size: 30px;
      cursor: pointer;
      display: block;
      margin: 30px auto 15px;
    }

    .mic.recording {
      background: #d22;
    }

    .mic:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .status {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    textarea {
      width: 100%;
      height: 130px;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: vertical;
    }

    .button {
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .button:disabled {
      background: #999;
      cursor: default;
    }

    .result {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #eee;
      line-height: 1.7;
    }

    .hidden {
      display: none;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h2>🎤 Speaking Practice</h2>

    <div class="label">
      Microphone Test
    </div>

    <div class="text">
      Click the microphone and speak in English.
    </div>


    <button
      id="micButton"
      class="mic"
      onclick="toggleRecording()"
    >
      🎙️
    </button>


    <div
      id="status"
      class="status"
    >
      Click the microphone to start recording.
    </div>


    <textarea
      id="answer"
      placeholder="Your speech will appear here..."
    ></textarea>


    <button
      id="transcribeButton"
      class="button"
      onclick="sendAudioToGAS()"
      disabled
    >
      📝 Convert Speech to Text
    </button>


    <div
      id="result"
      class="result hidden"
    ></div>

  </div>

</div>


<script>

/* ========================================
   GAS URL
======================================== */

const GAS_URL =
  "https://script.google.com/macros/s/AKfycbxOApj_Cg4HvRFKS725KMCZhHW5zoZSGfgGGcqHrlIMa596ApJMie7wdvcoCzO8yA6ZmQ/exec";


/* ========================================
   VARIABLES
======================================== */

let mediaRecorder = null;

let audioChunks = [];

let audioBlob = null;

let isRecording = false;


/* ========================================
   ELEMENTS
======================================== */

const micButton =
  document.getElementById(
    "micButton"
  );

const status =
  document.getElementById(
    "status"
  );

const answer =
  document.getElementById(
    "answer"
  );

const transcribeButton =
  document.getElementById(
    "transcribeButton"
  );

const result =
  document.getElementById(
    "result"
  );


/* ========================================
   RECORDING
======================================== */

async function toggleRecording() {

  if (isRecording) {

    stopRecording();

    return;

  }


  try {

    status.innerText =
      "🎙️ Requesting microphone access...";


    const stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    audioChunks = [];

    audioBlob = null;


    let options = {};


    /*
     * Chrome usually supports webm.
     */

    if (
      MediaRecorder.isTypeSupported(
        "audio/webm;codecs=opus"
      )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(
            audioChunks,
            {
              type:
                mediaRecorder.mimeType ||
                "audio/webm"
            }
          );


        stream
          .getTracks()
          .forEach(
            function(track) {
              track.stop();
            }
          );


        isRecording = false;

        micButton
          .classList
          .remove("recording");

        micButton.innerText =
          "🎙️";


        transcribeButton.disabled =
          false;


        status.innerText =
          "✅ Recording completed. Click the button below.";

      };


    mediaRecorder.start();


    isRecording = true;

    micButton
      .classList
      .add("recording");

    micButton.innerText =
      "⏹️";


    transcribeButton.disabled =
      true;


    status.innerText =
      "🔴 Recording... Speak in English";

  }

  catch (error) {

    console.error(
      "Microphone error:",
      error
    );


    status.innerText =
      "❌ Microphone error: " +
      error.name +
      " — " +
      error.message;

  }

}


/* ========================================
   STOP
======================================== */

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    mediaRecorder.stop();

  }

}


/* ========================================
   BLOB → BASE64
======================================== */

function blobToBase64(blob) {

  return new Promise(
    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          const result =
            reader.result;


          /*
           * Remove:
           * data:audio/webm;base64,
           */

          const base64 =
            result
              .split(",")[1];


          resolve(base64);

        };


      reader.onerror =
        function(error) {

          reject(error);

        };


      reader.readAsDataURL(blob);

    }
  );

}


/* ========================================
   SEND AUDIO TO GAS
======================================== */

async function sendAudioToGAS() {

  if (!audioBlob) {

    status.innerText =
      "❌ No audio recorded.";

    return;

  }


  transcribeButton.disabled =
    true;


  micButton.disabled =
    true;


  status.innerText =
    "🤖 Converting your speech to text...";


  try {

    const base64Audio =
      await blobToBase64(
        audioBlob
      );


    console.log(
      "Audio size:",
      base64Audio.length
    );


    /*
     * Send to GAS.
     */

    const response =
      await fetch(
        GAS_URL,
        {

          method: "POST",

          headers: {

            "Content-Type":
              "text/plain;charset=utf-8"

          },

          body:
            JSON.stringify({

              action:
                "transcribe",

              audio:
                base64Audio,

              mimeType:
                audioBlob.type ||
                "audio/webm"

            })

        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    console.log(
      "GAS response:",
      data
    );


    if (
      !data.success
    ) {

      throw new Error(
        data.error ||
        "Transcription failed."
      );

    }


    answer.value =
      data.text || "";


    status.innerText =
      "✅ Speech converted successfully.";


    result.classList
      .remove("hidden");


    result.innerHTML =
      "<b>Transcription:</b><br>" +
      escapeHtml(
        data.text || ""
      );

  }

  catch (error) {

    console.error(
      "Fetch error:",
      error
    );


    status.innerText =
      "❌ Failed to fetch: " +
      error.message;


    result.classList
      .remove("hidden");


    result.innerHTML =
      "<b>Error</b><br>" +
      escapeHtml(
        error.message
      );

  }

  finally {

    transcribeButton.disabled =
      false;

    micButton.disabled =
      false;

  }

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHtml(text) {

  return String(text || "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>

</body>

</html>

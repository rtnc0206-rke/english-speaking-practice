<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>🎤 Speaking Practice</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  padding: 30px 15px;

  font-family:
    Arial,
    sans-serif;

  background:
    #f7f7f7;

  color:
    #111;

}


.container {

  max-width:
    650px;

  margin:
    auto;

}


.card {

  background:
    white;

  padding:
    30px;

  border-radius:
    18px;

  box-shadow:
    0 3px 15px
    rgba(0,0,0,0.08);

}


h2 {

  margin-top:
    0;

}


.label {

  font-size:
    12px;

  color:
    #777;

  margin-top:
    20px;

  margin-bottom:
    8px;

}


.text {

  line-height:
    1.7;

}


.mic {

  width:
    90px;

  height:
    90px;

  border-radius:
    50%;

  border:
    none;

  background:
    #111;

  color:
    white;

  font-size:
    30px;

  cursor:
    pointer;

  display:
    block;

  margin:
    30px auto 15px;

}


.mic.recording {

  background:
    #d22;

}


button {

  cursor:
    pointer;

}


.primary {

  width:
    100%;

  padding:
    15px;

  border:
    none;

  border-radius:
    10px;

  background:
    #111;

  color:
    white;

  font-size:
    15px;

  margin-top:
    15px;

}


button:disabled {

  background:
    #999;

  cursor:
    default;

}


.status {

  text-align:
    center;

  color:
    #777;

  margin-bottom:
    20px;

  line-height:
    1.5;

}


textarea {

  width:
    100%;

  height:
    130px;

  padding:
    15px;

  font-size:
    16px;

  border:
    1px solid #ddd;

  border-radius:
    10px;

  resize:
    vertical;

}


.question {

  padding:
    18px;

  background:
    #f5f5f5;

  border-radius:
    12px;

  line-height:
    1.7;

}


.result {

  margin-top:
    25px;

  padding-top:
    25px;

  border-top:
    1px solid #eee;

  line-height:
    1.7;

}


.score {

  font-size:
    48px;

  font-weight:
    bold;

}


.hidden {

  display:
    none;

}


.loading {

  text-align:
    center;

  padding:
    30px;

}

</style>

</head>


<body>


<div class="container">


<div class="card">


<h2>
🎤 Speaking Practice
</h2>


<div id="loading"
     class="loading">

🤖 Creating your speaking question...

</div>


<div id="practice"
     class="hidden">


<div class="label">
Situation
</div>


<div
  id="situation"
  class="text">
</div>


<div class="label">
Your task
</div>


<div
  id="question"
  class="question">
</div>


<button
  id="micButton"
  class="mic"
  onclick="toggleRecording()">

🎙️

</button>


<div
  id="status"
  class="status">

Click the microphone and answer in English.

</div>


<textarea
  id="answer"
  placeholder="Your answer will appear here..."
></textarea>


<button
  id="transcribeButton"
  class="primary"
  onclick="transcribe()"
  disabled>

📝 Convert Speech to Text

</button>


<button
  id="checkButton"
  class="primary"
  onclick="checkAnswer()"
  disabled>

🤖 Check My Answer

</button>


<div
  id="result"
  class="result hidden">
</div>


</div>


</div>


</div>


<script>


/* ========================================
   GAS URL
======================================== */

const GAS_URL =
"https://script.google.com/macros/s/AKfycbxOApj_Cg4HvRFKS725KMCZhHW5zoZSGfgGGcqHrlIMa596ApJMie7wdvcoCzO8yA6ZmQ/exec";


/* ========================================
   VARIABLES
======================================== */

let practiceData =
  null;

let mediaRecorder =
  null;

let audioChunks =
  [];

let audioBlob =
  null;

let isRecording =
  false;


/* ========================================
   LOAD QUESTION
======================================== */

window.addEventListener(
  "load",
  loadQuestion
);


async function loadQuestion() {

  try {

    const response =
      await sendToGAS({

        action:
          "generate_question"

      });


    if (!response.success) {

      throw new Error(
        response.error
      );

    }


    practiceData =
      response;


    document
      .getElementById("loading")
      .classList
      .add("hidden");


    document
      .getElementById("practice")
      .classList
      .remove("hidden");


    document
      .getElementById("situation")
      .innerText =
        response.situation;


    document
      .getElementById("question")
      .innerText =
        response.question;

  }

  catch (error) {

    document
      .getElementById("loading")
      .innerText =
        "❌ " +
        error.message;

  }

}


/* ========================================
   SEND TO GAS
======================================== */

async function sendToGAS(data) {

  const response =
    await fetch(

      GAS_URL,

      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "text/plain;charset=utf-8"

        },

        body:
          JSON.stringify(data)

      }

    );


  if (!response.ok) {

    throw new Error(
      "HTTP " +
      response.status
    );

  }


  return await response.json();

}


/* ========================================
   RECORD
======================================== */

async function toggleRecording() {

  if (isRecording) {

    stopRecording();

    return;

  }


  try {

    const stream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:
            true

        });


    audioChunks =
      [];


    audioBlob =
      null;


    let options =
      {};


    if (
      MediaRecorder
        .isTypeSupported(
          "audio/webm;codecs=opus"
        )
    ) {

      options.mimeType =
        "audio/webm;codecs=opus";

    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        options
      );


    mediaRecorder
      .ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size > 0
        ) {

          audioChunks.push(
            event.data
          );

        }

      };


    mediaRecorder.onstop =
      function() {

        audioBlob =
          new Blob(

            audioChunks,

            {

              type:
                mediaRecorder.mimeType ||
                "audio/webm"

            }

          );


        stream
          .getTracks()
          .forEach(
            track =>
              track.stop()
          );


        isRecording =
          false;


        document
          .getElementById(
            "micButton"
          )
          .classList
          .remove(
            "recording"
          );


        document
          .getElementById(
            "micButton"
          )
          .innerText =
            "🎙️";


        document
          .getElementById(
            "transcribeButton"
          )
          .disabled =
            false;


        document
          .getElementById(
            "status"
          )
          .innerText =
            "✅ Recording completed.";

      };


    mediaRecorder.start();


    isRecording =
      true;


    document
      .getElementById(
        "micButton"
      )
      .classList
      .add(
        "recording"
      );


    document
      .getElementById(
        "micButton"
      )
      .innerText =
        "⏹️";


    document
      .getElementById(
        "status"
      )
      .innerText =
        "🔴 Recording... Speak in English";

  }

  catch (error) {

    document
      .getElementById(
        "status"
      )
      .innerText =
        "❌ Microphone error: " +
        error.name;

  }

}


/* ========================================
   STOP
======================================== */

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !==
      "inactive"
  ) {

    mediaRecorder.stop();

  }

}


/* ========================================
   BLOB → BASE64
======================================== */

function blobToBase64(blob) {

  return new Promise(

    function(resolve, reject) {

      const reader =
        new FileReader();


      reader.onloadend =
        function() {

          resolve(
            reader.result
              .split(",")[1]
          );

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        blob
      );

    }

  );

}


/* ========================================
   TRANSCRIBE
======================================== */

async function transcribe() {

  if (!audioBlob) {

    return;

  }


  const button =
    document
      .getElementById(
        "transcribeButton"
      );


  const status =
    document
      .getElementById(
        "status"
      );


  button.disabled =
    true;


  status.innerText =
    "🤖 Converting speech to text...";


  try {

    const base64 =
      await blobToBase64(
        audioBlob
      );


    const response =
      await sendToGAS({

        action:
          "transcribe",

        audio:
          base64,

        mimeType:
          audioBlob.type

      });


    if (!response.success) {

      throw new Error(
        response.error
      );

    }


    document
      .getElementById(
        "answer"
      )
      .value =
        response.text;


    document
      .getElementById(
        "checkButton"
      )
      .disabled =
        false;


    status.innerText =
      "✅ Speech converted successfully.";

  }

  catch (error) {

    status.innerText =
      "❌ " +
      error.message;

  }

  finally {

    button.disabled =
      false;

  }

}


/* ========================================
   CHECK ANSWER
======================================== */

async function checkAnswer() {

  const answer =
    document
      .getElementById(
        "answer"
      )
      .value
      .trim();


  if (!answer) {

    return;

  }


  const button =
    document
      .getElementById(
        "checkButton"
      );


  button.disabled =
    true;


  button.innerText =
    "🤖 AI is checking...";


  try {

    const response =
      await sendToGAS({

        action:
          "check_answer",

        situation:
          practiceData.situation,

        question:
          practiceData.question,

        answer:
          answer,

        target:
          practiceData.target

      });


    if (!response.success) {

      throw new Error(
        response.error
      );

    }


    showResult(
      response.result
    );

  }

  catch (error) {

    alert(
      "❌ " +
      error.message
    );


    button.disabled =
      false;

  }


}


/* ========================================
   RESULT
======================================== */

function showResult(data) {

  const result =
    document
      .getElementById(
        "result"
      );


  let alternatives =
    "";


  if (
    data.better_alternatives &&
    data.better_alternatives.length
  ) {

    alternatives =
      data
        .better_alternatives
        .map(
          item =>
            `<li>${escapeHtml(item)}</li>`
        )
        .join("");

  }


  result.innerHTML = `

    <div class="label">
      AI Feedback
    </div>

    <div class="score">
      ${escapeHtml(data.score)}/10
    </div>

    <p>
      🗣️ <b>Naturalness:</b>
      ${escapeHtml(data.naturalness)}
    </p>

    <p>
      📝 <b>Grammar:</b>
      ${escapeHtml(data.grammar)}
    </p>

    <p>
      🎯 <b>Target Expression:</b>
      ${escapeHtml(data.target_usage)}
    </p>

    <p>
      🇯🇵 <b>Feedback:</b><br>
      ${escapeHtml(data.feedback)}
    </p>

    ${
      alternatives
        ? `
          <p>
            💡 <b>More Natural Alternatives</b>
          </p>

          <ul>
            ${alternatives}
          </ul>
        `
        : ""
    }

  `;


  result
    .classList
    .remove(
      "hidden"
    );


  document
    .getElementById(
      "micButton"
    )
    .disabled =
      true;


  document
    .getElementById(
      "transcribeButton"
    )
    .style
    .display =
      "none";


  document
    .getElementById(
      "checkButton"
    )
    .style
    .display =
      "none";


  document
    .getElementById(
      "answer"
    )
    .disabled =
      true;

}


/* ========================================
   ESCAPE HTML
======================================== */

function escapeHtml(text) {

  return String(
    text || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>

<!DOCTYPE html>

<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>🎤 Speaking Practice</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f7f7f7;
      color: #111;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
    }

    .label {
      font-size: 12px;
      color: #777;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    .text {
      line-height: 1.7;
    }

    .mic {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      background: #111;
      color: white;
      font-size: 30px;
      cursor: pointer;
      display: block;
      margin: 30px auto 15px;
    }

    .mic.recording {
      background: #d22;
    }

    .status {
      text-align: center;
      color: #777;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 130px;
      box-sizing: border-box;
      padding: 15px;
      font-size: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      resize: vertical;
    }
  </style>

</head>

<body>

<div class="container">

  <div class="card">

```
<h2>🎤 Speaking Practice</h2>

<div class="label">
  Microphone Test
</div>

<div class="text">
  Click the microphone and speak in English.
</div>

<button
  id="micButton"
  class="mic"
  onclick="toggleRecording()">
  🎙️
</button>

<div id="status" class="status">
  Click the microphone to start recording.
</div>

<textarea
  id="answer"
  placeholder="Your speech will appear here...">
</textarea>
```

  </div>

</div>

<script>

let mediaRecorder = null;

let audioChunks = [];

let isRecording = false;


/* =========================
   MICROPHONE
========================= */

async function toggleRecording() {

  const button =
    document.getElementById("micButton");

  const status =
    document.getElementById("status");


  if (isRecording) {

    stopRecording();

    return;

  }


  try {

    status.innerText =
      "🎙️ Requesting microphone access...";


    const stream =
      await navigator.mediaDevices.getUserMedia({
        audio: true
      });


    audioChunks = [];


    mediaRecorder =
      new MediaRecorder(stream);


    mediaRecorder.ondataavailable =
      function(event) {

        if (event.data.size > 0) {

          audioChunks.push(event.data);

        }

      };


    mediaRecorder.onstop =
      function() {

        stream
          .getTracks()
          .forEach(function(track) {

            track.stop();

          });


        status.innerText =
          "✅ Recording completed.";

        console.log(
          "Audio recorded:",
          audioChunks.length,
          "chunks"
        );

      };


    mediaRecorder.start();


    isRecording = true;

    button.classList.add("recording");

    button.innerText = "⏹️";

    status.innerText =
      "🔴 Recording... Speak in English";

  }

  catch (error) {

    console.error(error);

    status.innerText =
      "❌ Microphone error: " +
      error.name +
      " — " +
      error.message;

  }

}


/* =========================
   STOP
========================= */

function stopRecording() {

  if (
    mediaRecorder &&
    mediaRecorder.state !== "inactive"
  ) {

    mediaRecorder.stop();

  }


  isRecording = false;


  const button =
    document.getElementById("micButton");


  button.classList.remove("recording");

  button.innerText = "🎙️";

}

</script>

</body>
</html>
